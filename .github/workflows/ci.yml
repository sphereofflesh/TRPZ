name: CI

# Заменяет шаблон dotnet-desktop.yml, который предназначался для WPF/WinForms
# и содержал незаполненные заглушки (Solution_Name, Test_Project_Path),
# из-за чего шаг «Restore the application» падал на каждом запуске.

on:
  push:
    branches: [main, test]
  pull_request:
    branches: [main, test]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: '8.0.x'
  SOLUTION: Labka.sln

jobs:
  build:
    name: Build (Release)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION }} --configuration Release --no-restore

  smoke:
    name: API smoke test
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build
        run: dotnet build Labka/Labka.csproj --configuration Release

      - name: Start API in background
        run: |
          cd Labka/bin/Release/net8.0
          ASPNETCORE_ENVIRONMENT=Development nohup dotnet Labka.dll --urls "http://localhost:5052" > app.log 2>&1 &
          echo $! > app.pid

      - name: Check GET /weatherforecast returns 5 items
        run: |
          status=000
          for i in $(seq 1 30); do
            status=$(curl -s -o weather.json -w '%{http_code}' http://localhost:5052/weatherforecast || true)
            if [ "$status" = "200" ]; then break; fi
            sleep 1
          done

          echo "HTTP status: $status"
          if [ "$status" != "200" ]; then
            echo "::error::GET /weatherforecast did not return 200 (got $status)"
            cat Labka/bin/Release/net8.0/app.log
            exit 1
          fi

          cat weather.json
          count=$(jq 'length' weather.json)
          echo "items: $count"
          if [ "$count" != "5" ]; then
            echo "::error::expected 5 forecast items, got $count"
            exit 1
          fi

      - name: Check Swagger schema is served in Development
        run: curl -sf -o /dev/null http://localhost:5052/swagger/v1/swagger.json

      - name: Stop API
        if: always()
        run: |
          if [ -f Labka/bin/Release/net8.0/app.pid ]; then
            kill "$(cat Labka/bin/Release/net8.0/app.pid)" || true
          fi
